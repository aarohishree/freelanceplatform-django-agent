<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f3f4f6; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    form { background: #fff; padding: 24px; border-radius: 12px; width: 300px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin-top: 0; }
    p { margin: 12px 0; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
    .errorlist { color: #b91c1c; padding-left: 16px; }
  </style>
</head>
<body>
  <form method="post">
    {% csrf_token %}
    <h1>Log in</h1>
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>
</body>
</html>
